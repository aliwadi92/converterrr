<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALI WADI CONVERTER</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }
        .container {
            text-align: center;
            background: white;
            padding: 50px 30px;
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }
        h1 {
            margin-bottom: 10px;
            font-size: 30px;
        }
        p {
            color: #666;
            margin-bottom: 35px;
            font-size: 17px;
        }
        .start-btn {
            border: none;
            padding: 15px 50px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: #111;
            color: white;
        }
        .start-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ALI WADI CONVERTER</h1>
        <p>محول الوحدات بسهولة وسرعة</p>
        <button class="start-btn" onclick="startConverter()">
            START
        </button>
    </div>
    <script>
        function startConverter() {
            window.location.href = "converter.html";
        }
    </script>
</body>
</html>
